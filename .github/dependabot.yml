# Keep dependency and Action updates visible as reviewable pull requests.
version: 2
updates:
- package-ecosystem: docker
  directories:
  - /docker/backend
  - /docker/frontend
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: npm
  directories:
  - /frontend
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: pip
  directories:
  - /backend
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
